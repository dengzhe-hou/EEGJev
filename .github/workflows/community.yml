name: EEGJev-Bench community results

on:
  pull_request:
    paths:
      - 'bench/community/**'
      - 'bench/tools/community_v13.py'
      - 'bench/eeg_jev/benchmark/**'
      - 'bench/examples/*community*'
      - 'bench/examples/score_linked_demo.py'
      - '.github/workflows/community.yml'
  push:
    branches: [main]
    paths:
      - 'bench/community/submissions/**'
      - 'bench/tools/community_v13.py'
      - 'bench/eeg_jev/benchmark/**'
      - 'bench/examples/*community*'
      - 'bench/examples/score_linked_demo.py'
      - '.github/workflows/community.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eegjev-community-${{ github.ref }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.4.3
      - run: python -I -B bench/examples/check_community_submission.py
      - run: python -I -B bench/tools/community_v13.py build --out "$RUNNER_TEMP/community.md"

  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python -I -B bench/tools/community_v13.py build
      - name: Refresh the leaderboard when results change
        run: |
          if git diff --quiet -- bench/community/LEADERBOARD.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bench/community/LEADERBOARD.md
          git commit -m 'Refresh the EEGJev-Bench community leaderboard'
          git push origin HEAD:main
