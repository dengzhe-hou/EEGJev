name: Benchmark correction
description: Report a problem with a source, question, answer, or score.
title: "[Correction] "
body:
  - type: input
    id: scope
    attributes:
      label: Source, question type, and version
      placeholder: "Example: T2; EEGJev-Bench v1.3"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Observed and expected behaviour
      description: Include the public source or code reference and a reproducible example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed correction
      description: Describe how the change could be verified.
